<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine King : Dig Your Way to Riches</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ========================= -->
<!-- 시작 화면 -->
<!-- ========================= -->

<div id="startScreen">

    <div class="logoBox">

        <h1>⛏️ Mine King</h1>

        <p>Dig Your Way to Riches</p>

    </div>

    <div class="saveSelect">

        <div class="saveSlot">

            <h2>💾 저장 슬롯 1</h2>

            <div id="slot1Info" class="slotInfo">

                비어 있음

            </div>

            <button id="slot1Start">
                시작하기
            </button>

            <button id="slot1Delete" class="deleteButton">
                삭제
            </button>

        </div>

        <div class="saveSlot">

            <h2>💾 저장 슬롯 2</h2>

            <div id="slot2Info" class="slotInfo">

                비어 있음

            </div>

            <button id="slot2Start">
                시작하기
            </button>

            <button id="slot2Delete" class="deleteButton">
                삭제
            </button>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 게임 화면 -->
<!-- ========================= -->

<div id="gameScreen" style="display:none;">

<header>

<div class="topBar">

<div class="gameTitle">

⛏️ Mine King

</div>

<div class="moneyBox">

💰

<span id="money">

0

</span>

원

</div>

</div>

<div class="statusBar">

<div>

❤️ 체력

<span id="hp">

100

</span>

</div>

<div>

💪 힘

<span id="power">

10

</span>

</div>

<div>

🏃 지구력

<span id="stamina">

100

</span>

</div>

<div>

😫 피로

<span id="fatigue">

0

</span>

</div>

</div>

</header>

<section class="mineSection">

<h2>

현재 층

</h2>

<div id="floorDisplay">

1층

</div>

<button id="mineButton">

⛏️

<br>

땅 파기

</button>

<div id="mineMessage">

광산에 오신 것을 환영합니다.

</div>

</section>

<section class="inventorySection">

<h2>

🎒 인벤토리

</h2>

<div id="inventoryGrid">

<!-- JS 생성 -->

</div>

</section>
