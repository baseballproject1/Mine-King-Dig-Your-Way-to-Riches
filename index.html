<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine King : Dig Your Way to Riches</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ========================= -->
<!-- 시작 화면 -->
<!-- ========================= -->

<div id="startScreen">

    <div class="logoBox">

        <h1>⛏️ Mine King</h1>

        <p>Dig Your Way to Riches</p>

    </div>

    <div class="saveSelect">

        <div class="saveSlot">

            <h2>💾 저장 슬롯 1</h2>

            <div id="slot1Info" class="slotInfo">

                비어 있음

            </div>

            <button id="slot1Start">
                시작하기
            </button>

            <button id="slot1Delete" class="deleteButton">
                삭제
            </button>

        </div>

        <div class="saveSlot">

            <h2>💾 저장 슬롯 2</h2>

            <div id="slot2Info" class="slotInfo">

                비어 있음

            </div>

            <button id="slot2Start">
                시작하기
            </button>

            <button id="slot2Delete" class="deleteButton">
                삭제
            </button>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 게임 화면 -->
<!-- ========================= -->

<div id="gameScreen" style="display:none;">

<header>

<div class="topBar">

<div class="gameTitle">

⛏️ Mine King

</div>

<div class="moneyBox">

💰

<span id="money">

0

</span>

원

</div>

</div>

<div class="statusBar">

<div>

❤️ 체력

<span id="hp">

100

</span>

</div>

<div>

💪 힘

<span id="power">

10

</span>

</div>

<div>

🏃 지구력

<span id="stamina">

100

</span>

</div>

<div>

😫 피로

<span id="fatigue">

0

</span>

</div>

</div>

</header>

<section class="mineSection">

<h2>

현재 층

</h2>

<div id="floorDisplay">

1층

</div>

<button id="mineButton">

⛏️

<br>

땅 파기

</button>

<div id="mineMessage">

광산에 오신 것을 환영합니다.

</div>

</section>

<section class="inventorySection">

<h2>

🎒 인벤토리

</h2>

<div id="inventoryGrid">

<!-- JS 생성 -->

</div>

</section><section class="bottomMenu">

<button id="shopButton">

🏪

<br>

만물상점

</button>

<button id="statusButton">

👤

<br>

능력치

</button>

<button id="saveButton">

💾

<br>

저장

</button>

</section>

</div>

<!-- ========================= -->
<!-- 만물상점 -->
<!-- ========================= -->

<div id="shopWindow" class="window" style="display:none;">

<div class="windowBox">

<h2>

🏪 만물상점

</h2>

<div class="shopTabs">

<button class="shopTab" data-tab="sell">

판매

</button>

<button class="shopTab" data-tab="gloves">

장갑

</button>

<button class="shopTab" data-tab="pickaxe">

곡괭이

</button>

<button class="shopTab" data-tab="bag">

가방

</button>

<button class="shopTab" data-tab="items">

아이템

</button>

</div>

<div id="shopContent">

</div>

<button id="closeShop">

닫기

</button>

</div>

</div>

<!-- ========================= -->
<!-- 능력치 -->
<!-- ========================= -->

<div id="statusWindow" class="window" style="display:none;">

<div class="windowBox">

<h2>

👤 캐릭터 정보

</h2>

<p>

❤️ 체력 :
<span id="statusHp">100</span>

</p>

<p>

💪 힘 :
<span id="statusPower">10</span>

</p>

<p>

🏃 지구력 :
<span id="statusStamina">100</span>

</p>

<p>

😫 피로 :
<span id="statusFatigue">0</span>

</p>

<p>

⭐ 레벨 :
<span id="playerLevel">1</span>

</p>

<p>

✨ 경험치 :
<span id="playerExp">0 / 100</span>

</p>

<button id="closeStatus">

닫기

</button>

</div>

</div>

<!-- ========================= -->
<!-- 알림창 -->
<!-- ========================= -->

<div id="messagePopup" style="display:none;">

<div id="messageText">

광물을 획득했습니다!

</div>

</div>

<script src="items.js"></script>
<script src="inventory.js"></script>
<script src="mine.js"></script>
<script src="shop.js"></script>
<script src="save.js"></script>
<script src="game.js"></script>

</body>
</html>
